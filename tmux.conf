setw -g mode-keys vi

set -g status-position top
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- Claude Code setup (~/Claude/claude-tmux-setup, ANLEITUNG.md) ---
# T1: programs may set the clipboard (OSC 52, also from the Mac mini); mouse per
# pane; closing a session switches to another one instead of leaving tmux
set -g allow-passthrough on
set -s set-clipboard on
set -g mouse on
set -g detach-on-destroy off

# T2: Claude Code windows are named "<state> <topic>". Claude shows up as its
# version (e.g. "2.1.302"), @claude_state is set by ~/.dots/tmux/claude-hook.sh
set -g automatic-rename-format '#{?#{||:#{@claude_host},#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}}},#{?#{==:#{@claude_state},working},⠋ ,#{?#{==:#{@claude_state},waiting},✋ ,#{?#{==:#{@claude_state},done},✓ ,}}}#{?#{@claude_host},#{=/28/…;s/^[^ ]+ //:@claude_title},#{=/28/…;s/^[^ ]+ //:pane_title}},#{pane_current_command}}'

# T3: project of the active window (top folder of the project, see
# tmux/claude-project.sh): where Claude was started, else the current folder.
# Used by the switcher and Ctrl+Tab.
set -g @project-name '#{?#{@claude_project},#{@claude_project},#{?#{@dir_project},#{@dir_project},#{b:pane_current_path}}}'

# T4: Ctrl+Space project switcher; @visited keeps it sorted by last visit
bind-key -n C-Space display-popup -E -B -w 80% -h 60% '~/.dots/tmux/claude-switcher.sh'
set-hook -g client-session-changed 'run-shell -b "~/.dots/tmux/visit.sh #{window_id}"'
set-hook -g session-window-changed 'run-shell -b "~/.dots/tmux/visit.sh #{window_id}"'
# T5: Ctrl+Tab toggles to the previous project (iTerm sends it as User0)
set -s user-keys[0] "\e[27;5;9~"
bind-key -n User0 run-shell -b '~/.dots/tmux/ctrl-tab.sh "#{client_name}"'
bind-key -n C-Tab run-shell -b '~/.dots/tmux/ctrl-tab.sh "#{client_name}"'
# T6: prefix+Space jumps to the next Claude session waiting for input (✋), then finished ones (✓)
bind-key Space run-shell -b '~/.dots/tmux/claude-next.sh "#{client_name}" "#{pane_id}"'
# T9: prefix+? menu with all shortcuts
bind-key ? run-shell -b '~/.dots/tmux/menu.sh "#{client_name}" "#{pane_id}"'
# T7: Ctrl+Y scratch Claude popup (hidden session _claude); Ctrl+Y inside it closes it again
bind-key -n C-y if-shell -F '#{==:#{session_name},_claude}' 'detach-client' "display-popup -E -w 80% -h 80% -T ' Claude ' '~/.dots/tmux/claude-popup.sh'"
# T8: Ctrl+G lazygit for the current pane's folder (q closes it)
bind-key -n C-g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T ' lazygit ' lazygit
# --- end Claude Code setup ---

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# tmux can't tell C-S-t from C-t, so C-t opens the new window in the current path
bind-key -n C-t new-window -c "#{pane_current_path}"
bind-key -n C-w kill-pane

bind '\' split-window -hf
# T10: | and _ split in the same folder; in a window on the Claude server (pink
# tab) or an ssh pane the new pane opens a shell there (split.sh)
bind | run-shell -b "~/.dots/tmux/split.sh '#{pane_id}' -h"
bind - split-window
bind _ run-shell -b "~/.dots/tmux/split.sh '#{pane_id}' -v"
# T11: Ctrl+V in a window on the Claude server copies a clipboard image there
# first, so the remote Claude can paste it; everywhere else Ctrl+V as usual
bind-key -n C-v if-shell -F '#{@claude_host}' "run-shell -b '~/.dots/tmux/claude-paste.sh #{pane_id} #{@claude_host}'" 'send-keys C-v'

# Resize pane shortcuts
#bind -r H resize-pane -L 10
#bind -r J resize-pane -D 10
#bind -r K resize-pane -U 10
#bind -r L resize-pane -R 10

#bind-key -T edit-mode-vi Up send-keys -X history-up
#bind-key -T edit-mode-vi Down send-keys -X history-down
#unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
#unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
#unbind-key -T copy-mode-vi C-v       ;   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
#unbind-key -T copy-mode-vi [         ;   bind-key -T copy-mode-vi [ send-keys -X begin-selection
#unbind-key -T copy-mode-vi ]         ;   bind-key -T copy-mode-vi ] send-keys -X copy-selection

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @themepack 'default/gray'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-yank'
# T13: keep the selection visible after copying; a click removes it again
set -g @yank_action 'copy-pipe-no-clear'
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; if-shell -F '#{scroll_position}' 'send-keys -X clear-selection' 'send-keys -X cancel'

# T12: save sessions every 15 min and restore them when tmux starts; Claude
# Code panes resume their conversation. prefix+Ctrl-s save, prefix+Ctrl-r restore.
# continuum must stay the last plugin.
set -g @resurrect-processes '"~claude->~/.dots/tmux/claude-restore.sh"'
set -g @resurrect-hook-post-save-all '~/.dots/tmux/claude-save-ids.sh'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

run '~/.dots/tpm/tpm'

# --- Claude Code setup, after the themepack (it rebuilds the status bar on every load) ---
# T3: the themepack sets an interval of 1; every interval runs the Claude scripts
set -g status-interval 2
# ✋ list (claude-status.sh, also sets the project options per pane!) and Claude
# usage in front of the themepack's right side. -F keeps continuum's autosave at
# the end; ## stays a literal # until the status bar is drawn (#[…] passes as is).
set -gF status-right "##(~/.dots/tmux/claude-status.sh '##{pane_id}')#[fg=colour243,bg=colour233] ##(~/.dots/tmux/claude-usage.sh) #{status-right}"
# ✻ = Claude Code runs in this window, 📡 = with Remote Control; windows on a
# Claude server (tmux/claude-hosts) are pink tabs (ANSI 5)
set -g @claude-icons '#{?#{||:#{@claude_host},#{||:#{@claude_state},#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}}}},#[fg=#{?#{@claude_host},colour233,colour173}]✻#{?#{@claude_rc},📡,} ,}'
set -g @host-colour colour5
set -g @tab-bg '#{?#{@claude_host},#{E:@host-colour},black}'
set -g @tab-fg '#{?#{@claude_host},colour233,colour250}'
# Same look as the themepack (gray), with the Claude icons
set -g window-status-format '#{?#{@claude_host},#[fg=colour233#,bg=#{E:@host-colour}]#[fg=colour233] #I:#{E:@claude-icons}#[fg=colour233]#W#F #[fg=#{E:@host-colour}#,bg=colour233],  #I:#{E:@claude-icons}#[fg=default]#W#F  }'
set -g window-status-current-format '#[fg=colour233,bg=#{E:@tab-bg}]#[fg=#{E:@tab-fg},nobold] #I:#{E:@claude-icons}#[fg=#{E:@tab-fg}]#W#F #[fg=colour233,bg=#{E:@tab-bg},nobold]'

# T13: after tpm, tmux-yank would override it: selecting with the mouse copies on
# release and leaves copy mode, so the cursor stays at the prompt (⌥+drag lets
# iTerm select instead). Scrolled back in the history, copy mode stays.
bind-key -T copy-mode-vi MouseDragEnd1Pane if-shell -F '#{scroll_position}' 'send-keys -X copy-pipe-no-clear "reattach-to-user-namespace pbcopy"' 'send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"'
# --- end Claude Code setup ---
