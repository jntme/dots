# tmux server for Claude sessions on the Mac mini (tmux -L claude).
# Invisible: the laptop's tmux provides keys and status bar; this one only keeps the sessions alive.
set -g prefix None            # all keys go to the local tmux
unbind-key -a                 # no server key bindings
set -g status off             # no second status bar
set -g set-titles on          # pass Claude's title on to the local tmux
set -g set-titles-string '#T'
set -g allow-passthrough on   # pass terminal notifications (OSC) through
set -s set-clipboard on       # copies (OSC 52) go on to the laptop's clipboard
set -g mouse off               # selecting text is left to iTerm, as locally (Cmd+C)
set -g escape-time 0
set -g history-limit 50000
set -g exit-empty off         # keep running without sessions (anchor)
# For every process in this server: hooks neither sort windows nor notify
set-environment -g CLAUDE_TMUX_AUTOSORT 0
set-environment -g CLAUDE_TMUX_NOTIFY 0
